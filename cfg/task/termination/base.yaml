# @package task.termination

# episode boundary
motion_timeout:
  is_timeout: true

# root tracking
root_pos_error:
  _target_: cum_body_pos_error
  body_names: ${task.shared.termination_root_body_name}
  min_steps: 25
  threshold: 0.4
  is_timeout: true
  enabled: true

